<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>特殊交互验收</title>
<style>body{font:16px system-ui;padding:20px;max-width:900px}button,input,select,[role=button],[role=group]{font:inherit;margin:8px;padding:10px;border:1px solid #aab;border-radius:6px}section{display:flex;align-items:center;gap:8px}.menu{padding:8px;background:#e6f1ff}.cssmenu{display:none}#csswrap:hover .cssmenu{display:block}#split{width:180px;display:flex;justify-content:space-between;cursor:pointer}#arrow{width:30px;text-align:center}#block{position:relative}#cover{position:absolute;inset:0;background:#9998;z-index:1}output{display:block}</style>
<section><div id="hoverwrap"><button id="hover" aria-haspopup="menu">悬停菜单</button><div id="hovermenu" role="menu" class="menu" hidden><button role="menuitem">悬停选项</button></div></div>
<div id="csswrap"><button aria-haspopup="menu">CSS菜单</button><div class="cssmenu" role="menu"><button role="menuitem">CSS选项</button></div></div></section>
<section><button id="plain" aria-haspopup="list" aria-controls="plainmenu">无语义菜单</button><ul id="plainmenu" hidden><li tabindex="-1">可聚焦菜单项</li><li>普通列表菜单项</li><div style="cursor:pointer">自绘菜单项</div></ul></section>
<section><button id="right">右键菜单</button><button id="double">双击菜单</button><button id="hold">长按菜单</button><div id="special" role="menu" hidden><button role="menuitem">特殊选项</button></div></section>
<section><input id="key" aria-label="键盘菜单"><button id="next">焦点下一项</button><div id="keymenu" role="menu" hidden><button role="menuitem">键盘选项</button></div></section>
<section><div id="split" role="button" aria-label="分裂创建"><span>分裂创建</span><span id="arrow">▾</span></div><div id="splitmenu" role="menu" hidden><button role="menuitem">箭头选项</button></div></section>
<section><select aria-label="原生选择" id="select"><option value="a">选项A</option><option value="b">选项B</option><option value="bad" disabled>禁用选项</option></select>
<select multiple aria-label="原生多选" id="multi"><option value="a">多选A</option><option value="b">多选B</option></select>
<label><input type="checkbox" id="check" aria-label="勾选控件">勾选控件</label><button id="aria" role="switch" aria-checked="false">自绘开关</button></section>
<section><div draggable="true" role="button" id="source">HTML拖动源</div><div role="group" id="drop">放置区域</div><div role="button" id="pointerSource">指针拖动源</div><div role="group" id="pointerDrop">指针放置区域</div></section>
<section><button disabled aria-busy="true">禁用按钮</button><div id="block"><button>被遮挡按钮</button><div id="cover"></div></div></section>
<output id="result">就绪</output>
<script>
window.counts={check:0,main:0,holdClick:0,drop:0,pointerDrop:0};
const q=id=>document.getElementById(id);
q('hoverwrap').addEventListener('mouseenter',()=>q('hovermenu').hidden=false);
q('hoverwrap').addEventListener('mouseleave',()=>q('hovermenu').hidden=true);
q('plain').addEventListener('mouseenter',()=>q('plainmenu').hidden=false);
q('plainmenu').onclick=e=>{q('result').textContent=e.target.textContent};
q('right').addEventListener('contextmenu',e=>{e.preventDefault();q('special').hidden=false;q('result').textContent='右键已展开'});
q('double').addEventListener('dblclick',()=>{q('special').hidden=false;q('result').textContent='双击已展开'});
let timer;q('hold').addEventListener('pointerdown',()=>{timer=setTimeout(()=>{q('special').hidden=false;q('result').textContent='长按已展开'},150)});
q('hold').addEventListener('pointerup',()=>clearTimeout(timer));q('hold').addEventListener('click',()=>counts.holdClick++);
q('key').addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowDown'){e.preventDefault();q('keymenu').hidden=false}});
q('split').onclick=e=>{if(e.target.id==='arrow')q('splitmenu').hidden=false;else counts.main++};
q('check').addEventListener('change',()=>counts.check++);q('aria').onclick=()=>q('aria').setAttribute('aria-checked',q('aria').getAttribute('aria-checked')==='true'?'false':'true');
q('source').addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain','fixture'));
q('drop').addEventListener('dragover',e=>e.preventDefault());q('drop').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.getData('text/plain')==='fixture')counts.drop++});
let dragging=false;q('pointerSource').addEventListener('pointerdown',()=>dragging=true);document.addEventListener('pointerup',e=>{if(dragging&&e.target===q('pointerDrop'))counts.pointerDrop++;dragging=false});
</script></html>
