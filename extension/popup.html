<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 浏览器控制</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
<main>
  <header>
    <div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01M10 12l6 4-3 .5-1 3z"/></svg></span><h1>AI 浏览器控制</h1></div>
    <span id="version" class="version"></span>
  </header>
  <section class="connection" aria-label="连接状态">
    <div class="connection-copy"><p class="status" aria-live="polite"><span id="status-dot" class="dot"></span><strong id="status-text">读取状态…</strong></p><p id="connection-detail" class="secondary">连接你的 AI 助手</p></div>
    <button id="toggle" type="button" class="primary" disabled>连接</button>
  </section>
  <p id="message" role="status" aria-live="polite" hidden></p>
  <section class="page" aria-label="当前标签页">
    <div class="section-label">当前标签页<span id="tab-badge" class="badge">读取中</span></div>
    <p id="tab-title" class="tab-title">读取中…</p>
    <p id="tab-domain" class="secondary domain"></p>
    <p id="tab-status" class="secondary"></p>
    <div class="actions">
      <button id="authorize" type="button" class="secondary-button" disabled>授权此页</button>
      <button id="release" type="button" class="secondary-button" disabled hidden>释放此页</button>
    </div>
  </section>
  <section class="options" aria-label="控制选项">
    <label class="switch-row" for="auto-authorize"><span class="switch-copy"><strong>自动授权所有网页</strong><small>关闭后，逐页授权</small></span><input id="auto-authorize" class="switch" type="checkbox" role="switch"></label>
    <label class="switch-row" for="cdp-enabled"><span class="switch-copy"><strong>CDP 真实交互</strong><small id="mode-description">默认关闭，使用 DOM 操作</small></span><input id="cdp-enabled" class="switch" type="checkbox" role="switch"></label>
    <label class="switch-row" for="screenshot-cdp"><span class="switch-copy"><strong>允许截图使用 CDP</strong><small id="screenshot-description">后台截图，按需临时附加</small></span><input id="screenshot-cdp" class="switch" type="checkbox" role="switch"></label>
    <label class="switch-row" for="lifecycle-wake"><span class="switch-copy"><strong>后台唤醒冻结页</strong><small id="lifecycle-wake-description">默认关闭，冻结时临时唤醒，继续 DOM 读取</small></span><input id="lifecycle-wake" class="switch" type="checkbox" role="switch"></label>
  </section>
  <details id="advanced">
    <summary>更多设置<span aria-hidden="true">⌄</span></summary>
    <div class="settings-content">
      <p class="hint">截图也使用浏览器调试权限；仅为截图临时附加的调试器，会在完成后解除。</p>
      <p class="hint">后台唤醒冻结页使用独立 CDP 权限，与 CDP 交互、截图开关互不影响；唤醒只为继续读取，不会切换页面。</p>
      <label class="field-label" for="cursor-hide">光标停留时间 <span class="secondary">秒</span></label>
      <div class="actions"><input id="cursor-hide" type="number" min="0" max="60" step="1" required aria-describedby="hide-hint"><button id="save-hide" type="button" class="secondary-button">保存</button></div>
      <p id="hide-hint" class="hint">默认 10 秒；0 为操作后立即隐藏</p>
      <label class="field-label" for="cursor-trail">轨迹残留时间 <span class="secondary">秒</span></label>
      <div class="actions"><input id="cursor-trail" type="number" min="0" max="60" step="1" required aria-describedby="trail-hint"><button id="save-trail" type="button" class="secondary-button">保存</button></div>
      <p id="trail-hint" class="hint">移动轨迹独立保留，默认 5 秒；最长 60 秒，0 为关闭</p>
      <label class="field-label" for="bridge-port">本机桥端口</label>
      <div class="actions"><input id="bridge-port" type="number" min="1" max="65535" step="1" required><button id="save-port" type="button" class="secondary-button">保存</button></div>
      <p class="hint">多个浏览器可分别连接不同端口</p>
      <a class="help-link" href="https://github.com/Kratosmax/ai-browser-control#更新" target="_blank" rel="noreferrer">更新与接入说明 <span aria-hidden="true">↗</span></a>
    </div>
  </details>
  <footer>后台操作 · 不移动系统鼠标</footer>
</main>
</body>
</html>
